<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">整机总量与进程排行的统计口径</title><desc id="desc">浏览器产生流量，由代理转发后经过物理网卡。两个进程可能记录相同数据，因此排行不能相加。</desc><rect width="1000" height="300" rx="20" fill="#f5f7fa"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" fill="#1c2633"><text x="40" y="51" font-size="24" font-weight="650">一份数据，可能经过多个进程。</text><rect x="40" y="86" width="235" height="92" rx="12" fill="#fff" stroke="#d6dde7"/><rect x="380" y="86" width="235" height="92" rx="12" fill="#fff" stroke="#d6dde7"/><rect x="720" y="86" width="235" height="92" rx="12" fill="#245cc4"/><text x="72" y="123" font-size="20">浏览器 / 开发工具</text><text x="72" y="151" font-size="16" fill="#526174">进程记录</text><text x="412" y="123" font-size="20">代理 / VPN</text><text x="412" y="151" font-size="16" fill="#526174">可能重复的转发记录</text><text x="752" y="123" font-size="20" fill="#fff">物理网卡</text><text x="752" y="151" font-size="16" fill="#fff">整机收发总量</text><text x="310" y="140" font-size="32">→</text><text x="650" y="140" font-size="32">→</text><text x="40" y="235" font-size="18">看整机总量了解累计；看进程排行定位来源。不要把进程各行相加。</text><text x="40" y="266" font-size="16" fill="#526174">网卡计数包含局域网流量，不等于手机热点或运营商账单。</text></g></svg>